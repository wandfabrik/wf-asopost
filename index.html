<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>あそポス：遊びましたをポスト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
  :root{
    --bg:#F8E9A0; --orange:#EE8B2C; --orange-deep:#C9650F;
    --brown:#4A3F33; --brown-soft:#8A7C68;
    --paper:#FFFFFF; --paper-warm:#FFFDF6; --paper-edge:#EADFC2; --line:#E7D9A6;
    --radius:14px; --shadow:0 8px 18px -8px rgba(60,50,40,.55);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--brown);font-family:"Zen Maru Gothic",sans-serif;font-weight:500;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
  .wrap{max-width:1080px;margin:0 auto;padding:34px 20px 60px}

  header{margin-bottom:28px}
  .brandrow{display:flex;align-items:baseline;gap:13px;flex-wrap:wrap}
  .logo{font-weight:900;font-size:clamp(28px,4.4vw,40px);letter-spacing:.03em;color:var(--brown)}
  .tagline{font-size:15px;font-weight:700;color:var(--orange-deep)}
  .lead{color:#6a5e4d;font-size:15px;margin-top:12px;line-break:strict}
  .lead .s{display:block;text-wrap:balance}
  .lead .s span{display:inline-block}

  .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start}
  @media (max-width:840px){ .grid{grid-template-columns:1fr} }

  .panel{background:var(--paper-warm);border:1px solid var(--line);border-radius:var(--radius);padding:24px 22px;box-shadow:0 4px 18px -12px rgba(74,63,51,.28)}
  .field{margin-bottom:20px}
  .field:last-child{margin-bottom:0}
  label.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:8px;color:var(--brown)}
  label.lbl .hint{font-weight:400;color:var(--brown-soft);font-size:12.5px;margin-left:6px}
  .inwrap{position:relative}
  .inwrap .at{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--orange-deep);font-weight:700;font-size:16px;pointer-events:none}
  input[type=text]{width:100%;padding:13px 14px;border-radius:10px;background:#fff;border:1px solid var(--line);color:var(--brown);font-family:inherit;font-weight:500;font-size:16px}
  input.hashandle{padding-left:30px}
  input[type=text]::placeholder{color:#c2b48c}
  input[type=text]:focus{outline:none;border-color:var(--orange);box-shadow:0 0 0 3px rgba(238,139,44,.22)}

  .seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px}
  .seg button{appearance:none;border:0;background:transparent;color:var(--brown-soft);font-family:inherit;font-weight:700;font-size:14px;padding:11px 8px;border-radius:7px;cursor:pointer}
  .seg button .sub{display:block;font-weight:500;font-size:11px;margin-top:2px;color:#bcae89}
  .seg button[aria-pressed=true]{background:var(--orange);color:#fff}
  .seg button[aria-pressed=true] .sub{color:#ffe6c9}

  .tweetbox{background:var(--paper-warm);border:1px solid var(--line);border-radius:10px;padding:14px 15px}
  .tweetbox .k{font-size:11px;font-weight:700;color:var(--brown-soft);letter-spacing:.1em;margin-bottom:7px}
  .tweetbox .t{font-size:15.5px;color:var(--brown);word-break:break-word}
  .tweetbox .t .men{color:var(--orange-deep);font-weight:700}
  .tweetbox .t .tag{color:#2f80c2}
  .testlink{display:inline-flex;align-items:center;gap:6px;margin-top:11px;font-size:13px;color:var(--orange-deep);text-decoration:none;font-weight:700}
  .testlink:hover{text-decoration:underline}
  .testlink[aria-disabled=true]{color:#c2b48c;pointer-events:none}

  /* ===== カードプレビュー ===== */
  .stage{display:flex;flex-direction:column;align-items:center;gap:16px}
  .stage .stagelabel{align-self:flex-start;font-size:11px;font-weight:700;color:var(--brown-soft);letter-spacing:.08em}
  .card{background:var(--paper);color:var(--brown);border-radius:10px;box-shadow:var(--shadow);border:1px solid var(--paper-edge);position:relative;overflow:hidden}
  .card::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--orange);z-index:1}
  @media (prefers-reduced-motion: no-preference){.card{transition:transform .3s ease,box-shadow .3s ease}.card:hover{transform:translateY(-3px)}}
  .ctitle{font-weight:900;font-size:21px;line-height:1.25;word-break:break-word}
  .ctitle .l2{display:block;font-size:16px;font-weight:700;margin-top:3px}
  .ctitle.empty{color:#cfc4a6}
  .qrhold{background:#fff;padding:10px;border-radius:8px;box-shadow:inset 0 0 0 1px var(--paper-edge)}
  .qrhold canvas{display:block}
  .qrhold.ghost{display:flex;align-items:center;justify-content:center;color:#cfc4a6;font-size:12px;text-align:center}
  .ccta{font-weight:900;font-size:14.5px;color:var(--orange-deep)}
  .csig{display:flex;flex-direction:column;gap:2px}
  .csig-by{font-size:9px;font-weight:700;letter-spacing:.14em;color:#b3a98a}
  .csig-logo{display:block}

  .card.postcard{width:300px;aspect-ratio:100/148;padding:26px 22px 18px;display:flex;flex-direction:column;align-items:center;text-align:center}
  .card.postcard .ctitle{margin:6px 0 2px;min-height:1.25em}
  .card.postcard .qrhold{margin:14px 0 12px}
  .card.postcard .qrhold.ghost{width:160px;height:160px}
  .card.postcard .csig{margin-top:auto;padding-top:14px;align-items:center}
  .card.postcard .csig-logo{width:118px}

  .card.meishi{width:392px;aspect-ratio:91/55;padding:20px 22px;display:grid;grid-template-columns:1fr auto;grid-template-areas:"title qr" "cta qr" "sig qr";align-content:center;gap:4px 16px;text-align:left}
  .card.meishi .ctitle{grid-area:title;font-size:17px}
  .card.meishi .ctitle .l2{font-size:13px;margin-top:1px;text-align:right}
  .card.meishi .ccta{grid-area:cta;align-self:center}
  .card.meishi .csig{grid-area:sig;align-self:end;align-items:flex-start}
  .card.meishi .csig-logo{width:96px}
  .card.meishi .qrhold{grid-area:qr;align-self:center}
  .card.meishi .qrhold.ghost{width:120px;height:120px}

  .actions{display:flex;flex-direction:column;gap:10px;width:300px;max-width:100%}

  .btn-outline{appearance:none;cursor:pointer;text-decoration:none;font-family:inherit;font-weight:900;
    background:#fff;color:var(--orange-deep);border:2px solid var(--orange);border-radius:11px;
    display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .btn-outline:hover{background:var(--orange);color:#fff}
  .btn-outline:focus-visible{outline:3px solid var(--orange-deep);outline-offset:2px}
  .btn-export{width:100%;font-size:16px;padding:14px}
  .btn-export:disabled{background:#ece2bf;color:#bcae89;border-color:transparent;cursor:not-allowed}
  .worksbtn{font-size:14.5px;padding:11px 20px}
  .hintline{font-size:12.5px;color:var(--brown-soft);text-align:center}

  .funnel{margin-top:46px;border-top:1px solid var(--line);padding-top:26px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
  .funnel .f-copy{max-width:36em}
  .funnel .f-copy .ft{font-weight:900;font-size:15px;color:var(--brown)}
  .funnel .f-copy .fs{font-size:13px;color:var(--brown-soft);margin-top:4px;line-break:strict}
  .funnel .f-copy .fs span{display:inline-block}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brandrow">
      <span class="logo" id="logoName">あそポス</span>
      <span class="tagline" id="tagline">遊びましたをポスト</span>

    <p class="lead"><span class="s"><span>QRコードの読み取りで、</span><span>感想ツイートの下書きが生成されます。</span></span><span class="s"><span>試遊卓に置いたり、</span><span>パッケージに封入したり、</span><span>ご自由に利用ください。</span></span></p>
  </header>

  <div class="grid">
    <section class="panel" aria-label="カードを作る">
      <div class="field">
        <label class="lbl" for="game">ゲーム名</label>
        <input type="text" id="game" placeholder="例：ごきぶりポーカー" autocomplete="off" maxlength="40">
      </div>

      <div class="field">
        <label class="lbl" for="handle">メンションするアカウント<span class="hint">任意・投稿に @ が付きます</span></label>
        <div class="inwrap">
          <span class="at">@</span>
          <input type="text" id="handle" class="hashandle" placeholder="wand_fabrik" autocomplete="off" maxlength="15">
        </div>
      </div>

      <div class="field">
        <label class="lbl" for="tags">ハッシュタグ<span class="hint">任意・#不要でスペース区切り</span></label>
        <input type="text" id="tags" placeholder="例：イベント名 ボードゲーム" autocomplete="off">
      </div>

      <div class="field">
        <label class="lbl">印刷サイズ</label>
        <div class="seg" role="group" aria-label="印刷サイズ">
          <button type="button" id="size-postcard" aria-pressed="true">ポストカード<span class="sub">100×148mm</span></button>
          <button type="button" id="size-meishi" aria-pressed="false">名刺<span class="sub">91×55mm</span></button>
        </div>
      </div>

      <div class="field">

          <a class="testlink" id="testLink" href="#" target="_blank" rel="noopener" aria-disabled="true">▶ 投稿画面を確認する</a>
        </div>
      </div>
    </section>

    <section class="stage" aria-label="カードのプレビュー">
      <span class="stagelabel" id="stageLabel">印刷されるカード（ポストカード・縦）</span>
      <div class="card postcard" id="card">
        <div class="ctitle empty" id="cardTitle"><span class="l1">『ゲーム名』</span><span class="l2">で遊びました！</span></div>

<script>
/* ====================================================== *
 *  CONFIG —— ここだけ後で差し替えればOK
 * ====================================================== */
const CONFIG = {
  TOOL_NAME: "あそポス",
  TAGLINE: "遊びましたをポスト",
  WANDFABRIK_PORTFOLIO_URL: "https://note.com/wand_fabrik/n/n12d7b194c20e?sub_rt=share_sb",
  LOGO_DATA_URI: document.getElementById('cardSig').src,
};
/* ====================================================== */

const $=(id)=>document.getElementById(id);
const gameEl=$('game'), handleEl=$('handle'), tagsEl=$('tags');
const cardTitle=$('cardTitle'), qrHold=$('qrHold'), card=$('card');
const tweetPreview=$('tweetPreview'), testLink=$('testLink');
const exportBtn=$('exportBtn'), worksLink=$('worksLink');
const sizePostcard=$('size-postcard'), sizeMeishi=$('size-meishi');
const stageLabel=$('stageLabel'), dpiHint=$('dpiHint');

$('logoName').textContent=CONFIG.TOOL_NAME;
$('tagline').textContent=CONFIG.TAGLINE;
worksLink.href=CONFIG.WANDFABRIK_PORTFOLIO_URL;
document.title=CONFIG.TOOL_NAME+"："+CONFIG.TAGLINE;

let lastQR=null, sizeMode='postcard';
const logoImg=new Image(); logoImg.src=CONFIG.LOGO_DATA_URI;
const LOGO_RATIO=720/238;

function buildText(game){ return `『${game||'　　'}』で遊びました！`; }
function cleanHandle(raw){ return (raw||'').replace(/[@＠\s]/g,'').replace(/[^A-Za-z0-9_]/g,''); }
function parseTags(raw){ return (raw||'').replace(/#/g,'').split(/[\s,、　]+/).map(s=>s.trim()).filter(Boolean); }
function buildIntentUrl(game,handle,tags){
  let text=buildText(game);
  if(handle) text+=` @${handle}`;
  const p=new URLSearchParams(); p.set('text',text);
  if(tags.length) p.set('hashtags',tags.join(','));
  return 'https://twitter.com/intent/tweet?'+p.toString();
}
function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

function drawQRtoCanvas(canvas,url,px){
  const qr=qrcode(0,'M'); qr.addData(url); qr.make(); lastQR=qr;
  const count=qr.getModuleCount(), dpr=window.devicePixelRatio||1;
  canvas.width=px*dpr; canvas.height=px*dpr;
  canvas.style.width=px+'px'; canvas.style.height=px+'px';
  const ctx=canvas.getContext('2d'), cell=(px*dpr)/count;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,px*dpr,px*dpr);
  ctx.fillStyle='#4A3F33';
  for(let r=0;r<count;r++)for(let c=0;c<count;c++)if(qr.isDark(r,c))
    ctx.fillRect(Math.round(c*cell),Math.round(r*cell),Math.ceil(cell),Math.ceil(cell));
}

function render(){
  const game=gameEl.value.trim(), handle=cleanHandle(handleEl.value), tags=parseTags(tagsEl.value);
  const hasGame=game.length>0;
  const menHtml=handle?`<span class="men"> @${escapeHtml(handle)}</span>`:'';
  const tagHtml=tags.map(t=>`<span class="tag"> #${escapeHtml(t)}</span>`).join('');
  tweetPreview.innerHTML=escapeHtml(buildText(game))+menHtml+tagHtml;

  const label=hasGame?game:'ゲーム名';
  cardTitle.innerHTML=`<span class="l1">『${escapeHtml(label)}』</span><span class="l2">で遊びました！</span>`;
  cardTitle.classList.toggle('empty',!hasGame);

  if(hasGame){
    const url=buildIntentUrl(game,handle,tags);
    qrHold.classList.remove('ghost'); qrHold.innerHTML='';
    const cv=document.createElement('canvas'); qrHold.appendChild(cv);
    drawQRtoCanvas(cv,url, sizeMode==='postcard'?150:120);
    testLink.href=url; testLink.setAttribute('aria-disabled','false');
    exportBtn.disabled=false;
  }else{
    qrHold.classList.add('ghost'); qrHold.innerHTML='入力するとQRが出ます';
    testLink.href='#'; testLink.setAttribute('aria-disabled','true');
    exportBtn.disabled=true; lastQR=null;
  }
}

function setSize(mode){
  sizeMode=mode;
  sizePostcard.setAttribute('aria-pressed',mode==='postcard');
  sizeMeishi.setAttribute('aria-pressed',mode==='meishi');
  card.classList.toggle('postcard',mode==='postcard');
  card.classList.toggle('meishi',mode==='meishi');
  stageLabel.textContent= mode==='postcard'?'印刷されるカード（ポストカード・縦）':'印刷されるカード（名刺・横）';
  dpiHint.textContent= mode==='postcard'?'ポストカード（100×148mm）/ 約300dpi。そのまま印刷できます。':'名刺サイズ（91×55mm）/ 約300dpi。封入や配布に。';
  render();
}

gameEl.addEventListener('input',render);
handleEl.addEventListener('input',render);
tagsEl.addEventListener('input',render);
sizePostcard.addEventListener('click',()=>setSize('postcard'));
sizeMeishi.addEventListener('click',()=>setSize('meishi'));

/* ===== 書き出し ===== */
function paintQR(ctx,x,y,size){
  const q=lastQR,n=q.getModuleCount(),cell=size/n; ctx.fillStyle='#4A3F33';
  for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(q.isDark(r,c))
    ctx.fillRect(Math.round(x+c*cell),Math.round(y+r*cell),Math.ceil(cell),Math.ceil(cell));
}
function qrBox(ctx,x,y,size,pad){
  roundRect(ctx,x-pad,y-pad,size+pad*2,size+pad*2,18);
  ctx.fillStyle='#fff'; ctx.fill(); ctx.strokeStyle='#EADFC2'; ctx.lineWidth=3; ctx.stroke();
  paintQR(ctx,x,y,size);
}
function drawSig(ctx,align,x,byPx,byY,logoW,logoY){   // presents by + ロゴ（align: 'center' | 'left'）
  ctx.textBaseline='top'; ctx.textAlign=align;
  ctx.fillStyle='#b3a98a'; ctx.font=`700 ${byPx}px "Zen Maru Gothic"`;
  ctx.fillText('presents by',x,byY);
  const lx = align==='center' ? x-logoW/2 : x;
  try{ ctx.drawImage(logoImg,lx,logoY,logoW,logoW/LOGO_RATIO); }catch(e){}
}

async function exportCard(){
  const game=gameEl.value.trim(); if(!game||!lastQR) return;
  try{
    await Promise.all([
      document.fonts.load('900 100px "Zen Maru Gothic"'),
      document.fonts.load('700 100px "Zen Maru Gothic"'),
    ]); await document.fonts.ready;
  }catch(e){}
  if(!logoImg.complete){ try{ await logoImg.decode(); }catch(e){} }

  const cv=$('exportCanvas');
  if(sizeMode==='postcard') drawPostcard(cv,game); else drawMeishi(cv,game);
  const safe=game.replace(/[\\/:*?"<>|]/g,'_').slice(0,24);
  const a=document.createElement('a');
  a.download=`asopos_${sizeMode}_${safe}.png`; a.href=cv.toDataURL('image/png'); a.click();
}

function drawPostcard(cv,game){
  const S=1181/300;                              // プレビュー .card.postcard(幅300px) → 印刷1181px
  const W=1181, H=Math.round(W*148/100);         // 1748
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d'), cx=W/2;
  const padX=22*S;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#EE8B2C'; ctx.fillRect(0,0,W,Math.round(6*S));   // 上のオレンジ帯(.card::before)
  ctx.textAlign='center'; ctx.textBaseline='top'; ctx.fillStyle='#4A3F33';
  let ty=26*S+6*S;                               // 上padding(26) + 帯ぶん
  const titlePx=Math.round(21*S);
  const lines=wrapText(ctx,`『${game}』`,`900 ${titlePx}px "Zen Maru Gothic"`,W-padX*2);
  ctx.font=`900 ${titlePx}px "Zen Maru Gothic"`;
  lines.slice(0,2).forEach(l=>{ctx.fillText(l,cx,ty); ty+=titlePx*1.25;});
  const subPx=Math.round(16*S);
  ctx.font=`700 ${subPx}px "Zen Maru Gothic"`; ctx.fillText('で遊びました！',cx,ty); ty+=subPx*1.25;
  const qr=Math.round(150*S), qpad=Math.round(10*S);   // .qrhold: QR150 + padding10
  ty+=14*S;                                      // .qrhold margin-top
  qrBox(ctx,cx-qr/2,ty,qr,qpad);
  ty+=qr+qpad+12*S;                              // QR下端 + margin-bottom
  const ctaPx=Math.round(14.5*S);
  ctx.fillStyle='#C9650F'; ctx.font=`900 ${ctaPx}px "Zen Maru Gothic"`;
  ctx.fillText('読み取りで感想をポスト',cx,ty);
  // 署名（.csig: margin-top:auto で下寄せ・中央）
  const logoW=Math.round(118*S), byPx=Math.round(9*S);
  const logoY=H-18*S-logoW/LOGO_RATIO;           // 下padding(18)
  drawSig(ctx,'center',cx,byPx,logoY-byPx*1.7,logoW,logoY);
}

function drawMeishi(cv,game){
  const S=1075/392;                              // プレビュー .card.meishi(幅392px) → 印刷1075px
  const W=1075, H=Math.round(W*55/91);           // 650
  cv.width=W; cv.height=H;
  const ctx=cv.getContext('2d');
  const padX=22*S, padY=20*S, gapX=16*S, gap=4*S;
  ctx.fillStyle='#fff'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle='#EE8B2C'; ctx.fillRect(0,0,W,Math.round(6*S));   // 帯
  // 右：QR（縦中央）
  const qr=Math.round(120*S), qpad=Math.round(10*S), qBox=qr+qpad*2;
  const qBoxX=W-padX-qBox, qBoxY=(H-qBox)/2;
  qrBox(ctx,qBoxX+qpad,qBoxY+qpad,qr,qpad);
  // 左カラム（title / で遊びました(右揃え) / cta / 署名）を縦中央に積む
  const lx=padX, lw=qBoxX-gapX-lx;
  const titlePx=Math.round(17*S), subPx=Math.round(13*S),
        ctaPx=Math.round(14.5*S), byPx=Math.round(9*S),
        logoW=Math.round(96*S), logoH=Math.round(96*S)/LOGO_RATIO;
  ctx.font=`900 ${titlePx}px "Zen Maru Gothic"`;
  const lines=wrapText(ctx,`『${game}』`,`900 ${titlePx}px "Zen Maru Gothic"`,lw).slice(0,2);
  const totalH=lines.length*titlePx*1.25 + subPx*1.3 + gap + ctaPx + gap + byPx*1.5 + logoH;
  let ty=Math.max(padY,(H-totalH)/2);
  ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillStyle='#4A3F33';
  ctx.font=`900 ${titlePx}px "Zen Maru Gothic"`;
  lines.forEach(l=>{ctx.fillText(l,lx,ty); ty+=titlePx*1.25;});
  ctx.textAlign='right'; ctx.font=`700 ${subPx}px "Zen Maru Gothic"`;
  ctx.fillText('で遊びました！',lx+lw,ty); ty+=subPx*1.3+gap;
  ctx.textAlign='left'; ctx.fillStyle='#C9650F'; ctx.font=`900 ${ctaPx}px "Zen Maru Gothic"`;
  ctx.fillText('読み取りで感想をポスト',lx,ty); ty+=ctaPx+gap;
  drawSig(ctx,'left',lx,byPx,ty,logoW,ty+byPx*1.5);
}

function wrapText(ctx,text,font,maxW){
  ctx.font=font; if(ctx.measureText(text).width<=maxW)return[text];
  const chars=[...text],lines=[];let cur='';
  for(const ch of chars){ if(ctx.measureText(cur+ch).width>maxW&&cur){lines.push(cur);cur=ch;}else cur+=ch; }
  if(cur)lines.push(cur); return lines;
}
function roundRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

exportBtn.addEventListener('click',exportCard);
setSize('postcard');
</script>
